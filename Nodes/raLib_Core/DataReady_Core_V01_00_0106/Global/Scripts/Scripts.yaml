Name: Scripts
Type: NetLogicCategoryFolder
Children:
- Name: LanguageUpdate
  Type: NetLogic
  Children:
  - Class: Method
    Name: RefreshLanguages
- Name: DateTimeManager
  Type: NetLogic
  Children:
  - Name: DebugEnable
    Type: BaseDataVariableType
    DataType: Boolean
  - Class: Method
    Name: TimeRangeUpdate
- Name: MasterClockLogic
  Type: NetLogic
  WriteMask: BrowseName|DataType|Description|DisplayName|MinimumSamplingInterval|UserAccessLevel
  Children:
  - Name: Time
    Type: BaseDataVariableType
    DataType: DateTime
    Children:
    - Name: Year
      Type: BaseDataVariableType
      DataType: Int32
    - Name: Month
      Type: BaseDataVariableType
      DataType: Int32
    - Name: Day
      Type: BaseDataVariableType
      DataType: Int32
    - Name: Hour
      Type: BaseDataVariableType
      DataType: Int32
    - Name: Minute
      Type: BaseDataVariableType
      DataType: Int32
    - Name: Second
      Type: BaseDataVariableType
      DataType: Int32
  - Name: UTCTime
    Type: BaseDataVariableType
    DataType: DateTime
    Children:
    - Name: Year
      Type: BaseDataVariableType
      DataType: Int32
    - Name: Month
      Type: BaseDataVariableType
      DataType: Int32
    - Name: Day
      Type: BaseDataVariableType
      DataType: Int32
    - Name: Hour
      Type: BaseDataVariableType
      DataType: Int32
    - Name: Minute
      Type: BaseDataVariableType
      DataType: Int32
    - Name: Second
      Type: BaseDataVariableType
      DataType: Int32
  - Name: Pulse1Sec
    Type: BaseDataVariableType
    DataType: Boolean
    Children:
    - Name: DynamicLink
      Type: DynamicLink
      DataType: NodePath
      Value: "../Time/Second.0"
      Children:
      - Name: Mode
        Type: BaseVariableType
        DataType: DynamicLinkMode
        Value: 2
- Name: CoreFunctions
  Type: NetLogic
- Name: DesignTimeAutoConfig
  Type: NetLogic
  Children:
  - Name: BehaviourStartPriority
    Type: BehaviourStartPriorityVariableType
    DataType: Byte
    Value: 180
  - Class: Method
    Name: BuildContent
  - Class: Method
    Name: InitializeNewProject
